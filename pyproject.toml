[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilzbase"
version = "0.1.0"
description = "Autonomous Raspberry Pi mushroom-monitoring logger"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
pilzbase = "pilzbase.app:main"

[tool.setuptools.packages.find]
include = ["pilzbase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
