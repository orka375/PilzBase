# BCM numbering. Verify all proposed SPI/ADC assignments against the PCB.
button: {enabled: true, gpio: 16, pull_up: true, debounce_ms: 50, long_press_seconds: 3}
led: {enabled: true, gpio: 19, active_high: true, status_timeout_seconds: 10}
relays:
  relay_2:
    enabled: false  # Enable only after polarity and safe boot behavior verified
    gpio: 20
    laser_off_level: true   # HIGH = laser OFF; LOW = laser ON
sensors:
  pt100_1: {enabled: false, interface: spi, bus: 0, device: 0, cs_gpio: 8, rtd_nominal_ohms: 100, reference_ohms: 430, wires: 3}
  pt100_2: {enabled: false, interface: spi, bus: 0, device: 1, cs_gpio: 7, rtd_nominal_ohms: 100, reference_ohms: 430, wires: 3}
  dfr0553: {enabled: false, interface: i2c, bus: 1, address: 0x48}
  opto_1220: {enabled: false, adc_channel: 1, shunt_ohms: 150, min_ma: 4, max_ma: 20, min_mm: null, max_mm: null  # Set actual 4mA/20mA distances from laser configuration}
  grove_soil: {enabled: false, adc_channel: 0}
  bme280: {enabled: false, interface: i2c, bus: 1, address: 0x76}
  ens160: {enabled: false, interface: i2c, bus: 1, address: 0x53}
  scd41: {enabled: false, interface: i2c, bus: 1, address: 0x62}
  cjmcu_34725: {enabled: false, interface: i2c, bus: 1, address: 0x29}  # TCS34725 RGBC, no UV
ups_hat_c: {enabled: false, bus: 1, address: 0x43}
# All sensor enable flags default OFF until real wiring and calibration verified.
